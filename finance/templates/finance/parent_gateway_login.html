<!-- finance/templates/finance/parent_gateway_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St Francisco Kabiero Academy — Secure Parent Portal Gate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1628;
            --blue-accent: #2563eb;
            --surface: #ffffff;
            --surface-2: #f0f4ff;
            --border: #dde5f7;
            --text: #0a1628;
            --text-muted: #64748b;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
        }

        * { -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--surface-2);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 1.25rem;
            -webkit-font-smoothing: antialiased;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(10,22,40,0.05);
            max-width: 460px;
            width: 100%;
            padding: 2.75rem 2.25rem;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--blue-accent) 0%, #3b82f6 100%);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .portal-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: #eff6ff;
            color: var(--blue-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.6rem;
            box-shadow: 0 4px 12px rgba(37,99,235,0.1);
        }

        .login-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 0.4rem;
            text-align: center;
            letter-spacing: -0.01em;
        }
        .login-card p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
            padding-left: 1.1rem;
            padding-right: 1.1rem;
            min-height: 48px;
        }

        .form-control {
            border: 1px solid var(--border);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 0.8rem 1.1rem;
            font-size: 0.95rem;
            color: var(--text);
            min-height: 48px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--blue-accent);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn-portal {
            background: linear-gradient(135deg, var(--blue-accent) 0%, #3b82f6 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.9rem;
            border-radius: 100px;
            width: 100%;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37,99,235,0.25);
            margin-top: 1.25rem;
            min-height: 52px;
        }
        .btn-portal:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.4);
        }
        .btn-portal:active { transform: scale(0.97); }

        .btn-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            margin-top: 1.25rem;
            transition: color 0.2s ease;
            min-height: 44px;
        }
        .btn-home:hover { color: var(--navy); }

        .alert { border-radius: var(--radius-sm); font-size: 0.88rem; }

        @media (max-width: 768px) {
            .login-card { padding: 2rem 1.5rem; border-radius: var(--radius-md); }
            .login-card h2 { font-size: 1.25rem; }
            .portal-icon { width: 54px; height: 54px; font-size: 1.5rem; }
        }

        @media (max-width: 400px) {
            body { padding: 1rem; }
            .login-card { padding: 1.75rem 1.25rem; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="portal-icon">
        <i class="bi bi-person-badge-fill"></i>
    </div>
    <h2>Parent Security Access</h2>
    <p class="subtitle">Enter your registered mobile number, full name as it appears on the student record, and your 4-6 digit portal PIN.</p>

    <!-- Feedback Alerts Display -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger border-0 small py-2.5 text-center rounded-3 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1.5"></i> {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'parent_portal_gateway' %}">
        {% csrf_token %}
        
        <!-- 1. Phone Verification Input -->
        <div class="mb-3.5">
            <label class="form-label">Registered Mobile Number</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                <input type="text" name="parent_phone" class="form-control" placeholder="e.g. 0722334455" required>
            </div>
        </div>

        <!-- 2. Guardian Full Name -->
        <div class="mb-3.5">
            <label class="form-label">Guardian Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="guardian_name" class="form-control" placeholder="e.g. David Kipchirchir" required autocomplete="off">
            </div>
        </div>

        <!-- 3. Portal PIN -->
        <div class="mb-4">
            <label class="form-label">Portal PIN</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-check-fill"></i></span>
                <input type="password" name="guardian_pin" class="form-control" placeholder="4-6 digit PIN" required autocomplete="off">
            </div>
        </div>

        <button type="submit" class="btn btn-portal">Authorize Secure Console Access</button>
        <a href="{% url 'public_home' %}" class="btn-home"><i class="bi bi-arrow-left me-1"></i> Return to Homepage</a>
    </form>
</div>

</body>
</html>
