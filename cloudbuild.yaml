steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kabiero-sms/kabiero-sms:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kabiero-sms/kabiero-sms:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kabiero-sms'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kabiero-sms/kabiero-sms:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--update-env-vars'
      - 'ALLOWED_HOSTS=kabiero-sms-bzool6cpga-uc.a.run.app,kabiero-sms-593064914742.us-central1.run.app'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kabiero-sms/kabiero-sms:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY